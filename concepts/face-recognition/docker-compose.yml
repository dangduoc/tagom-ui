# Full stack: pgvector database + FastAPI backend + Angular/Ionic frontend.
#
# Start everything:            docker compose up --build -d
# Frontend:                    http://localhost:4200
# Backend:                     http://localhost:8000/api/health
# Database (host access):      postgresql://face:face@localhost:5433/facedb
#
# To run only the database (e.g. while iterating on backend/frontend locally
# with `uvicorn`/`ng serve`), use: docker compose up -d db
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: face-recognition-db
    environment:
      POSTGRES_USER: face
      POSTGRES_PASSWORD: face
      POSTGRES_DB: facedb
    ports:
      - "5433:5432"   # 5433 to avoid clashing with a locally installed Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U face -d facedb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: face-recognition-backend
    environment:
      DB_BACKEND: postgres
      DATABASE_URL: postgresql://face:face@db:5432/facedb
      ALLOWED_ORIGINS: "*"
      # The frontend container proxies /api from its own bridge address, so
      # loopback alone would reject it. 172.16.0.0/12 is Docker's default
      # bridge range. Anything outside it -- including the LAN reaching the
      # published port below -- still gets a 403.
      TRUSTED_CLIENT_CIDRS: "127.0.0.0/8,::1,172.16.0.0/12"
    ports:
      # Published on all interfaces for convenience while developing. On a
      # station, bind these to 127.0.0.1 so the LAN cannot reach them at all;
      # the CIDR guard above is the backstop, not the boundary.
      - "8000:8000"
    volumes:
      # Cache the ~30MB insightface model download across container rebuilds
      - insightface_models:/root/.insightface
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: face-recognition-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  pgdata:
  insightface_models:
