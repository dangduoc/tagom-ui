<div class="cam-col">
  <div class="cam">
    <video #video class="feed" playsinline muted autoplay></video>
    <div class="scanline"></div>
    <div class="brackets">
      <span class="tl"></span>
      <span class="tr"></span>
      <span class="bl"></span>
      <span class="br"></span>
    </div>
    <p class="status" [class.unknown]="statusSettled()">
      <span class="pulse"></span>{{ statusText() }}
    </p>
  </div>
  <p class="hold">{{ station.L().holdPose }}</p>
</div>

<div class="copy">
  <p class="eyebrow">{{ station.L().faceIdEyebrow }}</p>
  <h1 class="tg-display">{{ station.L().faceIdTitle }}</h1>

  <div class="options">
    <button
      tg-option-card
      [icon]="'phone'"
      [overline]="station.L().cantFaceQ"
      [label]="station.L().cantScan"
      (click)="station.goPhone()"
    ></button>

    <button
      tg-option-card
      [icon]="'plus'"
      [overline]="station.L().stillCantQ"
      [label]="station.L().optRegister"
      [variant]="'outline'"
      (click)="station.goRegister()"
    ></button>
  </div>
</div>
