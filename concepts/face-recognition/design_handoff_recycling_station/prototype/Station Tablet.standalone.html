document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

── */\n  --tagom-lime: #dee84e;      /* chartreuse / signal lime */\n  --tagom-green: #004d43;     /* deep forest green */\n  --tagom-black: #000000;\n  --tagom-white: #ffffff;\n\n  /* ── Lime ramp (from primary #dee84e) ── */\n  --lime-50:  #fbfce4;\n  --lime-100: #f4f7bd;\n  --lime-300: #e7ee7f;\n  --lime-500: #dee84e;        /* = --tagom-lime */\n  --lime-700: #b3bd2f;\n  --lime-900: #7c8416;\n\n  /* ── Green ramp (from primary #004d43) ── */\n  --green-50:  #e4efec;\n  --green-100: #b9d6cf;\n  --green-300: #4f8a7d;\n  --green-500: #00695b;\n  --green-700: #004d43;       /* = --tagom-green */\n  --green-900: #00332c;\n\n  /* ── Neutrals (green-tinted, oklch-harmonised) ── */\n  --neutral-0:   #ffffff;\n  --neutral-50:  oklch(0.985 0.006 165);\n  --neutral-100: oklch(0.955 0.008 165);\n  --neutral-200: oklch(0.905 0.010 165);\n  --neutral-300: oklch(0.835 0.012 165);\n  --neutral-500: oklch(0.62 0.014 165);\n  --neutral-700: oklch(0.42 0.016 165);\n  --neutral-900: oklch(0.24 0.018 165);\n  --neutral-950: #0b1614;\n\n  /* ── Semantic status ── */\n  --status-success: #00695b;\n  --status-info:    #2c7a7b;\n  --status-warning: #c98a12;\n  --status-danger:  #b23a2e;\n\n  /* ── Semantic aliases — LIGHT theme (default) ── */\n  --surface-page:   var(--tagom-lime);\n  --surface-card:   var(--tagom-white);\n  --surface-sunken: var(--lime-100);\n  --surface-inverse: var(--tagom-green);\n\n  --text-heading:   var(--tagom-green);\n  --text-body:      var(--tagom-black);\n  --text-muted:     var(--green-500);\n  --text-on-accent: var(--tagom-lime);\n  --text-inverse:   var(--tagom-white);\n\n  --accent:         var(--tagom-green);\n  --on-accent:      var(--tagom-lime);\n  --accent-hover:   var(--green-900);\n\n  --border-subtle:  color-mix(in srgb, var(--tagom-green) 18%, transparent);\n  --border-strong:  var(--tagom-green);\n  --focus-ring:     var(--tagom-green);\n\n  --link:           var(--tagom-green);\n  --link-hover:     var(--green-900);\n}\n\n/* ── DARK theme — the brand's night mode: green field, lime ink ── */\n.dark, [data-theme=\"dark\"] {\n  --surface-page:   var(--tagom-green);\n  --surface-card:   var(--green-900);\n  --surface-sunken: #003b34;\n  --surface-inverse: var(--tagom-lime);\n\n  --text-heading:   var(--tagom-lime);\n  --text-body:      var(--tagom-lime);\n  --text-muted:     color-mix(in srgb, var(--tagom-lime) 65%, var(--tagom-green));\n  --text-on-accent: var(--tagom-green);\n  --text-inverse:   var(--tagom-green);\n\n  --accent:         var(--tagom-lime);\n  --on-accent:      var(--tagom-green);\n  --accent-hover:   var(--lime-300);\n\n  --border-subtle:  color-mix(in srgb, var(--tagom-lime) 22%, transparent);\n  --border-strong:  var(--tagom-lime);\n  --focus-ring:     var(--tagom-lime);\n\n  --link:           var(--tagom-lime);\n  --link-hover:     var(--lime-300);\n}\n<\u002Fstyle>\n  <style>/* Tagom — Typography tokens */\n:root {\n  /* Families — Anek Latin is the single brand typeface. */\n  --font-sans: \"Anek Latin\", system-ui, -apple-system, \"Segoe UI\", sans-serif;\n  --font-display: \"Anek Latin\", system-ui, sans-serif; /* rendered wide: wdth 125 */\n  --font-mono: ui-monospace, \"SF Mono\", Menlo, Consolas, monospace;\n\n  /* Weights */\n  --fw-regular: 400;  /* @kind font */\n  --fw-medium: 500;   /* @kind font */\n  --fw-semibold: 600; /* @kind font */\n  --fw-bold: 700;     /* @kind font */\n\n  /* Signature width stretch for display type */\n  --wdth-display: \"wdth\" 125; /* @kind other */\n  --wdth-normal: \"wdth\" 100;  /* @kind other */\n\n  /* Type scale (px) — display headings run wide + bold */\n  --text-display: 50px;\n  --text-h1: 40px;\n  --text-h2: 30px;\n  --text-h3: 24px;\n  --text-lg: 20px;\n  --text-body-size: 16px;\n  --text-sm: 14px;\n  --text-xs: 12px;\n  --text-2xs: 10px;\n\n  /* Line heights */\n  --lh-tight: 1.05; /* @kind other */\n  --lh-snug: 1.2;   /* @kind other */\n  --lh-normal: 1.5; /* @kind other */\n\n  /* Letter spacing — uppercase labels get a touch of me. Optional.',\n      continueAnon:'Continue without an account', downloadApp:'Scan to download the app',\n      registerHere:'Register here', secMain:'Main information', secFace:'Facial data',\n      faceOptional:'Optional — highly recommended',\n      fFullName:'Full name', fPhone:'Phone number', fAge:'Age', fCitizenId:'Citizen ID',\n      fAddress:'Address', fCity:'City / Province', fWard:'Ward', fStreet:'Street address',\n      phFullName:'e.g. Jane Doe', optional:'(optional)', requiredNote:'Required field',\n      faceWhy:'Lets the station recognise you by face next time — no phone needed.',\n      faceGuide:'Position your face in the frame', capturePhoto:'Capture photo',\n      faceDone:'All 5 face photos captured', retake:'Retake', cancel:'Cancel', registerCta:'Register',\n      pickTitle:'What would you like to weigh?', pickSub:'Tap a type to start weighing',\n      more:'More types',\n      cat_nhua:'Plastic', cat_giay:'Paper', cat_kimloai:'Metal', cat_thuytinh:'Glass', cat_vai:'Fabric', cat_chua:'Unsorted',\n      weighing:'Weighing', settling:'Settling…', holdStill:'Keep it still on the scale',\n      added:'Recorded', undo:'Undo', reweigh:'Weigh again', weighAnother:'Weigh another', finish:'Done',\n      scaleLinked:'Scale connected',\n      sessionList:'This session', total:'Total', empty:'Nothing yet.\\nPick a type to begin.',\n      guest:'Guest', noPhone:'Anonymous',\n      summaryThanks:'Thank you!', savedFor:'Saved for', savedAnon:'Anonymous session — not saved to an account',\n      sessionTotal:'This visit', personalTotal:'You’ve brought', communityTotal:'This station has gathered',\n      thisVisit:'this visit', joinNote:'Every weigh you add joins the whole community’s total.',\n      appPointer:'See your full history in the Tagom app on your phone.', done:'Finish',\n      helpTitle:'Need a staff member?', helpSub:'Tap below and someone will come right over to help you.',\n      helpCall:'Call staff over', helpClose:'I’m okay, thanks',\n      helpCalledTitle:'Staff notified', helpCalledSub:'Please wait a moment — someone is on their way.',\n      dismiss:'Close',\n      keypadTitle:'Enter phone number', keypadSub:'We’ll look up your account.', lookup:'Find',\n      callStaff:'Call staff',\n    },\n  };\n\n  componentWillUnmount() { this.clearAll(); }\n  clearAll() { if (this._iv) clearInterval(this._iv); if (this._to) clearTimeout(this._to); if (this._undo) clearTimeout(this._undo); this._iv=this._to=this._undo=null; }\n\n  // ── navigation ──\n  goto = (screen) => { this.clearAll(); this.setState({ screen, overlay:null, error:null, phase: screen==='weigh'?this.state.phase:'idle' }); if (screen==='identify') this.autoDetect(); };\n  // route into the material step per the chosen mode\n  enter = () => { if (this.state.mode === 'quick') { this.pick('chuaphanloai'); } else { this.setState({ screen:'category', overlay:null }); } };\n  toggleLang = () => this.setState(s => ({ lang: s.lang==='vn'?'en':'vn' }));\n\n  start = () => {           // from idle-start, confirmed-yes, keypad-lookup\n    if (!this.state.identity) this.setState({ identity:{ name:'Chị Lan Nguyễn', phone:'090 ••• 47' } });\n    this.setState({ overlay:null });\n    this.enter();\n  };\n  startSorted = () => { this.clearAll(); this.setState({ mode:'sorted', screen:'identify', identity:null, items:[] }); this.autoDetect(); };\n  startQuick = () => { this.clearAll(); this.setState({ mode:'quick', screen:'identify', identity:null, items:[] }); this.autoDetect(); };\n  fromIdle = () => { this.clearAll(); this.setState({ screen:'identify', identity:null, items:[] }); this.autoDetect(); };\n  autoDetect = () => { this._to = setTimeout(() => { if (this.state.screen==='identify') this.setState({ screen:'confirmed', identity:{ name:'Chị Lan Nguyễn', phone:'090 ••• 47' } }); }, 2800); };\n  notMe = () => { this.clearAll(); this.setState({ identity:null, screen:'unknown' }); };\n  skip = () => { this.clearAll(); this.setState({ identity:'anon', overlay:null }); this.enter(); };\n\n  // ── register ──\n  goRegister = () => { this.clearAll(); this.setState({ screen:'register' }); };\n  setForm = (k) => (e) => { const v = e.target.value; this.setState(s => ({ form: { ...s.form, [k]: v } })); };\n  onFullName = this.setForm('fullName'); onPhone = this.setForm('phone'); onAge = this.setForm('age');\n  onCity = this.setForm('city'); onWard = this.setForm('ward'); onAddress = this.setForm('address'); onCitizenId = this.setForm('citizenId');\n  captureFace = () => this.setState(s => ({ faceCount: Math.min(5, s.faceCount + 1) }));\n  retakeFaces = () => this.setState({ faceCount: 0 });\n  maskPhone = (p) => { const d = (p||'').replace(/\\D/g,''); if (d.length < 5) return p || ''; return d.slice(0,3) + ' ••• ' + d.slice(-2); };\n  submitRegister = () => {\n    const f = this.state.form;\n    if (!f.fullName.trim() || f.phone.replace(/\\D/g,'').length < 8) return;\n    this.clearAll();\n    this.setState({ identity: { name: f.fullName.trim(), phone: this.maskPhone(f.phone) }, overlay:null });\n    this.enter();\n  };\n\n  // ── weighing ──\n  pick = (key) => { this.clearAll(); this.setState({ currentCat:key, screen:'weigh', phase:'settling', live:0, tick:0, holdPct:0 }); this.runScale(key); };\n  pickNhua=()=>this.pick('nhua'); pickGiay=()=>this.pick('giay'); pickKimloai=()=>this.pick('kimloai'); pickThuytinh=()=>this.pick('thuytinh'); pickVai=()=>this.pick('vai'); pickChua=()=>this.pick('chuaphanloai');\n  pickAgain = () => { this.clearAll(); if (this.state.mode === 'quick') { this.pick('chuaphanloai'); } else { this.setState({ screen:'category', phase:'idle' }); } };\n\n  runScale = (key) => {\n    const target = this.CATS[key].target * (0.94 + Math.random()*0.12);\n    let tick = 0;\n    if (this._iv) clearInterval(this._iv);\n    this._iv = setInterval(() => {\n      tick += 1;\n      if (tick < 16) {                          // settling ~1.6s\n        const prog = tick/16;\n        const noise = (Math.random()-0.5) * 0.9 * (1-prog);\n        this.setState({ tick, phase:'settling', live: Math.max(0, target*prog + noise) });\n      } else if (tick < 36) {                   // stable, 2s hold\n        const jitter = (Math.random()-0.5) * 0.03;\n        const holdPct = Math.min(100, Math.round(((tick-16)/20)*100));\n        this.setState({ tick, phase:'stable', live: target + jitter, holdPct });\n      } else {\n        clearInterval(this._iv); this._iv = null;\n        this.lock(target);\n      }\n    }, 100);\n  };\n\n  lock = (target) => {\n    if (this._iv) { clearInterval(this._iv); this._iv = null; }\n    const w = Math.round(target*100)/100;\n    const item = { id: Date.now(), key: this.state.currentCat, weight: w };\n    this.setState(s => ({ phase:'locked', live:w, items:[...s.items, item], undoSecs:3, tick:36 }));\n    this.startUndoCountdown();\n  };\n  startUndoCountdown = () => {\n    let n = 3;\n    if (this._undo) clearInterval(this._undo);\n    this._undo = setInterval(() => { n -= 1; if (n <= 0) { clearInterval(this._undo); this._undo=null; this.setState({ undoSecs:0 }); } else this.setState({ undoSecs:n }); }, 1000);\n  };\n  undo = () => { if (this._undo) clearInterval(this._undo); this.clearAll(); this.setState(s => ({ items: s.items.slice(0,-1) })); this.pickAgain(); };\n  reweigh = () => { if (this._undo) clearInterval(this._undo); this.clearAll(); this.setState(s => { const items = s.phase==='locked' ? s.items.slice(0,-1) : s.items; return { items, phase:'settling', live:0, tick:0, holdPct:0 }; }); this.runScale(this.state.currentCat); };\n\n  gotoSummary = () => { if (!this.state.items.length) return; this.clearAll(); this.setState({ screen:'summary', phase:'idle' }); };\n  reset = () => { this.clearAll(); this.setState({ screen:'idle', items:[], identity:null, currentCat:null, phase:'idle', keypad:'' }); };\n  back = () => {\n    const s = this.state.screen;\n    if (s==='weigh') { this.clearAll(); if (this.state.mode==='quick') this.reset(); else this.setState({ screen:'category', phase:'idle' }); }\n    else if (s==='category') this.reset();\n    else if (s==='confirmed'||s==='unknown') this.fromIdle();\n    else if (s==='register') { this.clearAll(); this.setState({ screen:'unknown' }); }\n    else if (s==='profile') { this.clearAll(); this.setState({ screen: this.state.prevScreen || 'confirmed' }); }\n    else this.reset();\n  };\n\n  // ── overlays ──\n  openHelp = () => this.setState({ overlay:'help', helpCalled:false });\n  callStaff = () => this.setState({ overlay:'help', helpCalled:true, error:null });\n  closeHelp = () => this.setState({ overlay:null, helpCalled:false });\n  openKeypad = () => { this.clearAll(); this.setState({ overlay:'keypad', keypad:'' }); };\n  openNoFace = () => { this.clearAll(); this.setState({ overlay:'noface' }); };\n  closeNoFace = () => { this.setState({ overlay:null }); if (this.state.screen==='identify') this.autoDetect(); };\n  nfFirst = () => { this.clearAll(); this.setState({ overlay:null, identity:null, screen:'unknown' }); };\n  nfRetry = () => { this.clearAll(); this.setState({ overlay:null, screen:'identify' }); this.autoDetect(); };\n  nfPhone = () => { this.clearAll(); this.setState({ overlay:'keypad', keypad:'' }); };\n  closeKeypad = () => this.setState({ overlay:null });\n  press = (d) => this.setState(s => ({ keypad: (s.keypad + d).slice(0,11) }));\n  key0=()=>this.press('0'); key1=()=>this.press('1'); key2=()=>this.press('2'); key3=()=>this.press('3'); key4=()=>this.press('4'); key5=()=>this.press('5'); key6=()=>this.press('6'); key7=()=>this.press('7'); key8=()=>this.press('8'); key9=()=>this.press('9');\n  keyDel = () => this.setState(s => ({ keypad: s.keypad.slice(0,-1) }));\n\n  showErr = (kind) => this.setState({ error:kind, overlay:null });\n  errScale=()=>this.showErr('scale'); errNet=()=>this.showErr('network'); errCam=()=>this.showErr('camera');\n  dismissError = () => this.setState({ error:null });\n\n  removeItem = (id) => { this.clearAll(); this.setState(s => ({ items: s.items.filter(it => it.id !== id) })); };\n\n  // ── profile ──\n  openProfile = () => { if (this.state.identity === 'anon' || !this.state.identity) return; this.clearAll(); this.setState(s => ({ prevScreen: (s.screen==='identify'||s.screen==='profile') ? 'confirmed' : s.screen, screen:'profile', overlay:null, profileEdit:false })); };\n  editProfile = () => this.setState(s => ({ profileEdit:true, pform: { ...s.profile } }));\n  cancelEdit = () => this.setState({ profileEdit:false });\n  saveProfile = () => this.setState(s => ({ profile: { ...s.pform }, profileEdit:false }));\n  setPForm = (k) => (e) => { const v = e.target.value; this.setState(s => ({ pform: { ...s.pform, [k]: v } })); };\n  onPFullName = this.setPForm('fullName'); onPPhone = this.setPForm('phone'); onPAge = this.setPForm('age');\n  onPCity = this.setPForm('city'); onPWard = this.setPForm('ward'); onPAddress = this.setPForm('address'); onPCitizenId = this.setPForm('citizenId');\n\n  // ── helpers ──\n  fmt = (n) => (Math.round(n*100)/100).toFixed(2);\n  fmtBig = (n) => n.toLocaleString(this.state.lang==='vn'?'vi-VN':'en-US', {minimumFractionDigits:1, maximumFractionDigits:1});\n  catName = (key) => { const c=this.CATS[key]; return c ? (this.state.lang==='vn'?c.vn:c.en) : ''; };\n\n  makeQR = (n, seed) => {\n    const cells = [];\n    for (let i=0;i<n*n;i++) {\n      const r=Math.floor(i/n), c=i%n;\n      const corner = (r<3&&c<3)||(r<3&&c>=n-3)||(r>=n-3&&c<3);\n      const on = corner ? ((r===0||r===2||c===0||c===2||r===n-1||c===n-1|| (r>=n-3&&(r===n-3||r===n-1))) ) : (((i*7+seed)%3===0)||((i*i+seed)%5===0));\n      cells.push(React.createElement('span',{key:i,style:{background: on?'#004d43':'transparent',borderRadius:'1px'}}));\n    }\n    return cells;\n  };\n\n  renderVals() {\n    const s = this.state;\n    const L = this.STR[s.lang];\n    const inFlow = ['identify','confirmed','unknown','register','profile','category','weigh'].includes(s.screen);\n    const showRail = ['categor
